<!doctype html>
<!-- PROTOTYPE, throwaway. Three variants of the app's home screen (market board, what changed,
     sample case, overlay chart), switchable with ?variant=A|B|C, the bottom bar, or the arrow keys.
     Real collected rates are embedded below by build step; nothing here is production code. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design options (prototype)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;padding-bottom:84px}
svg text{font-family:inherit}

/* ---------- prototype switcher (not part of any design) ---------- */
#switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:99;font-size:13px;border:2px solid #ffd43b}
#switch button{background:#333;color:#fff;border:0;border-radius:999px;width:32px;height:32px;font-size:15px}
#switch button:hover{background:#555}
#switch span{padding:0 12px;white-space:nowrap}
#switch small{color:#ffd43b;margin-right:8px;letter-spacing:.08em}

/* ================= A: terminal ================= */
.A{background:#0b0f14;color:#c9d4e0;font-size:13px;min-height:100vh}
.A .mono{font-family:"SF Mono",Menlo,Consolas,"Hiragino Sans",monospace}
.A header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid #1d2733;background:#0e141b}
.A header h1{font-size:13px;margin:0;color:#f2b84b;letter-spacing:.12em;font-weight:600}
.A .tick{display:flex;gap:18px;overflow:hidden;white-space:nowrap;color:#8a99ab}
.A .tick b{color:#e6edf5;font-weight:600}
.A .grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:1px;background:#1d2733}
.A .pane{background:#0b0f14;padding:12px 14px;min-width:0}
.A h2{font-size:11px;letter-spacing:.14em;color:#6f8196;margin:0 0 8px;font-weight:600;text-transform:uppercase}
.A table{border-collapse:collapse;width:100%}
.A th{font-weight:500;color:#6f8196;font-size:11px;text-align:right;padding:4px 8px;border-bottom:1px solid #1d2733;white-space:nowrap}
.A th.cur{color:#f2b84b;text-align:center;border-left:1px solid #1d2733}
.A th.case{cursor:pointer}.A th.case:hover{color:#fff}
.A th.sel{color:#fff;background:#16202b}
.A td{padding:5px 8px;border-bottom:1px solid #141c25;text-align:right;white-space:nowrap}
.A td.name{text-align:left;white-space:normal;min-width:230px}
.A td.name small{display:block;color:#5d6e82;font-size:11px}
.A td.sel{background:#111922}
.A tr.row{cursor:pointer}.A tr.row:hover td{background:#121a23}
.A tr.off td{opacity:.45}
.A .v{color:#e6edf5;font-size:14px}
.A .d{font-size:11px;display:block}
.A .up{color:#3ddc97}.A .dn{color:#ff6b6b}.A .fl{color:#56677b}
.A .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.A .mv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid #141c25}
.A .mv small{color:#5d6e82;grid-column:1/3}
.A .mv b{font-weight:500;color:#dfe8f1}
.A .seg{display:inline-flex;border:1px solid #1d2733;border-radius:4px;overflow:hidden;margin-left:8px}
.A .seg button{background:none;border:0;color:#6f8196;padding:3px 9px;font-size:11px}
.A .seg button.on{background:#f2b84b;color:#0b0f14}
.A .note{color:#5d6e82;font-size:11px;margin-top:8px}

/* ================= B: analyst dashboard ================= */
.B{background:#f3f5f9;color:#172033;min-height:100vh;font-size:14px}
.B .top{background:#fff;border-bottom:1px solid #e2e7ef;padding:18px 32px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.B .top h1{font-size:19px;margin:0;font-weight:700}
.B .top h1 small{display:block;font-weight:400;color:#6b778c;font-size:12px;margin-top:2px}
.B .pick{display:flex;align-items:center;gap:8px;color:#6b778c;font-size:12px}
.B .pills{display:inline-flex;background:#eef1f6;border-radius:10px;padding:3px}
.B .pills button{border:0;background:none;padding:6px 14px;border-radius:8px;color:#4a5670;font-weight:600;font-size:13px}
.B .pills button.on{background:#fff;color:#1d4ed8;box-shadow:0 1px 3px rgba(20,30,60,.15)}
.B .wrap{max-width:1280px;margin:0 auto;padding:24px 32px;display:grid;gap:20px;grid-template-columns:repeat(12,minmax(0,1fr))}
.B .card{background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.05);min-width:0}
.B .card h2{font-size:13px;margin:0 0 14px;color:#6b778c;font-weight:600}
.B .kpi{grid-column:span 3}
.B .kpi .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.B .kpi .sub{color:#6b778c;font-size:12.5px;margin-top:6px;line-height:1.45}
.B .league{grid-column:span 7}.B .chart{grid-column:span 5}.B .feed{grid-column:span 12}
.B .lr{display:grid;grid-template-columns:22px minmax(0,1.25fr) minmax(0,1.6fr) 74px 70px 78px;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #eef1f6;cursor:pointer}
.B .lr.head{border:0;color:#8a94a6;font-size:11.5px;cursor:default;padding:0 0 6px}
.B .lr .rk{color:#a3acbb;font-weight:700;font-size:13px}
.B .lr .nm b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.B .lr .nm small{color:#8a94a6;font-size:11.5px}
.B .bar{height:22px;background:#eef1f6;border-radius:6px;position:relative;overflow:hidden}
.B .bar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.B .val{font-weight:700;font-size:17px;text-align:right}
.B .r{text-align:right}
.B .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.B .chip.up{background:#e3f7ec;color:#0a7a45}.B .chip.dn{background:#fde8e8;color:#b42318}.B .chip.fl{background:#eef1f6;color:#6b778c}
.B .lr.dim{opacity:.4}
.B .feedgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.B .fi{border:1px solid #e8ecf3;border-radius:12px;padding:12px 14px}
.B .fi b{display:block;font-size:13.5px;margin-bottom:2px}
.B .fi small{color:#6b778c;font-size:12px}
.B .fi .mvv{float:right;font-weight:700;font-size:15px}
.B .muted{color:#8a94a6;font-size:12px}

/* ================= C: editorial ================= */
.C{background:#fbf8f2;color:#1c1b19;min-height:100vh}
.C .col{max-width:1080px;margin:0 auto;padding:44px 40px 30px}
.C .kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a0422a;font-weight:700;border-top:3px solid #1c1b19;padding-top:10px;display:flex;justify-content:space-between}
.C h1{font-family:Georgia,"Times New Roman",serif;font-size:54px;line-height:1.16;margin:18px 0 14px;font-weight:600;letter-spacing:-.01em}
.C .stand{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-size:19px;line-height:1.6;color:#45423c;max-width:760px;margin:0 0 30px}
.C h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:40px 0 4px;border-top:1px solid #1c1b19;padding-top:10px}
.C .dek{color:#6d685e;font-size:14px;margin:0 0 18px}
.C .multi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 34px}
.C .sm{cursor:pointer;border-top:1px solid #d9d2c3;padding-top:10px}
.C .sm.on{border-top:3px solid #a0422a;padding-top:8px}
.C .sm h3{margin:0;font-size:15px}
.C .sm p{margin:2px 0 6px;color:#6d685e;font-size:12.5px}
.C .two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:44px}
.C .mvl{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #e4ddcf;padding:10px 0;font-size:14.5px}
.C .mvl span:first-child small{display:block;color:#6d685e;font-size:12px}
.C .mvl .x{font-family:Georgia,serif;font-size:22px;white-space:nowrap}
.C .up{color:#1f6f43}.C .dn{color:#a0422a}
.C table{border-collapse:collapse;width:100%;font-size:14px}
.C th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:right;border-bottom:1px solid #1c1b19;padding:6px 8px;color:#6d685e}
.C th:first-child,.C td:first-child{text-align:left;padding-left:0}
.C td{text-align:right;padding:9px 8px;border-bottom:1px solid #e4ddcf}
.C td small{color:#6d685e;display:block;font-size:11.5px}
.C td.hi{font-weight:700;color:#a0422a}
.C .foot{color:#8b867b;font-size:12px;margin-top:26px;line-height:1.6}
.C .stats{display:flex;gap:56px;margin:26px 0 8px;flex-wrap:wrap}
.C .stats b{display:block;font-family:Georgia,serif;font-size:40px;font-weight:400;line-height:1.05}
.C .stats b i{font-style:normal;font-size:22px;color:#8b867b;margin:0 10px 0 2px}
.C .stats span{font-size:12.5px;color:#6d685e;letter-spacing:.02em}
.C .sm h3 span{float:right;font-family:Georgia,serif;font-weight:400;font-size:18px}
.C .sw{display:inline-block;width:10px;height:10px;margin-right:8px}
</style>
</head>

const short = s => s.replace("楽天銀行エディション"," 楽天版").replace("（定率増加プラン）","").replace(/（.*?）/g,"");

// One "headline" cell per product: the first plan that has that currency/term on sale.
function cell(p, cur, term){
  let fallback=null;
  for(const pl of p.plans){
    const s=pl.series[cur+"|"+term]; if(!s) continue;
    const last=s[s.length-1], prev=s.length>1?s[s.length-2]:null;
    const c={plan:pl, hist:s, date:last[0], v:last[1], prev:prev?prev[1]:null, prevDate:prev?prev[0]:null};
    if(c.v!=null) return c; fallback=fallback||c;
  }
  return fallback;
}
const delta = c => (c && c.v!=null && c.prev!=null) ? +(c.v-c.prev).toFixed(3) : null;
const fmt = v => v==null ? "–" : v.toFixed(2);
const fd = d => d==null ? "" : (d>0?"+":d<0?"−":"±")+Math.abs(d).toFixed(2);
const cls = d => d==null?"fl":d>0?"up":d<0?"dn":"fl";
const md = s => s ? s.slice(5).replace("-","/") : "";

function movers(){
  const out=[];
  for(const p of DATA) for(const pl of p.plans) for(const [k,s] of Object.entries(pl.series)){
    if(s.length<2) continue; const a=s[s.length-2], b=s[s.length-1]; const [cur,term]=k.split("|");
    if(a[1]!=null&&b[1]!=null&&a[1]!==b[1]) out.push({p,pl,cur,term,d:+(b[1]-a[1]).toFixed(3),v:b[1],from:a[0],to:b[0]});
    else if(a[1]==null&&b[1]!=null) out.push({p,pl,cur,term,d:null,kind:"resumed",v:b[1],from:a[0],to:b[0]});
    else if(a[1]!=null&&b[1]==null) out.push({p,pl,cur,term,d:null,kind:"suspended",v:null,from:a[0],to:b[0]});
  }
  out.forEach(m=>m.stale=(T(m.to)-T(m.from))/864e5>20);
  return out.sort((x,y)=>(x.stale-y.stale)||Math.abs(y.d||9)-Math.abs(x.d||9));
}
function ranked(cur,term){
  return DATA.map(p=>({p,c:cell(p,cur,term)})).filter(x=>x.c).sort((a,b)=>(b.c.v??-1)-(a.c.v??-1));
}

/* ---------- shared SVG charts ---------- */
function spark(hist,w,h,color){
  const pts=hist.slice(-24).filter(x=>x[1]!=null); if(pts.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const vs=pts.map(x=>x[1]), lo=Math.min(...vs), hi=Math.max(...vs), r=(hi-lo)||1;
  const d=pts.map((x,i)=>`${i?"L":"M"}${(i/(pts.length-1)*(w-2)+1).toFixed(1)},${(h-2-(x[1]-lo)/r*(h-4)).toFixed(1)}`).join("");
  return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.4"/></svg>`;
}
const T = s => new Date(s+"T00:00:00Z").getTime();
function chart(series,o){
  const W=o.w,H=o.h,m={l:o.ml??34,r:o.mr??12,t:10,b:22};
  const end=Math.max(...series.flatMap(s=>s.pts.map(x=>T(x[0]))));
  let start=Math.min(...series.flatMap(s=>s.pts.map(x=>T(x[0]))));
  if(o.range==="1Y") start=end-365*864e5; if(o.range==="6M") start=end-183*864e5;
  const vis=series.map(s=>({...s,pts:s.pts.filter(x=>T(x[0])>=start)}));
  const vs=vis.flatMap(s=>s.pts.map(x=>x[1]).filter(v=>v!=null)); if(!vs.length) return `<svg width="${W}" height="${H}"></svg>`;
  let lo=Math.floor(Math.min(...vs)*2)/2, hi=Math.ceil(Math.max(...vs)*2)/2; if(hi===lo) hi=lo+0.5;
  const x=t=>m.l+(t-start)/((end-start)||1)*(W-m.l-m.r), y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);
  let g="";
  const step=(hi-lo)>3?1:0.5;
  for(let v=lo;v<=hi+1e-9;v+=step) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${o.grid}"/><text x="${m.l-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="${o.ink}">${v.toFixed(1)}</text>`;
  const y0=new Date(start).getUTCFullYear(), y1=new Date(end).getUTCFullYear();
  for(let yr=y0;yr<=y1+1;yr++){const t=Date.UTC(yr,0,1); if(t>start&&t<end) g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H-m.b}" stroke="${o.grid}" stroke-dasharray="2 3"/><text x="${x(t)+4}" y="${H-7}" font-size="10" fill="${o.ink}">${yr}</text>`;}
  for(const s of vis){
    let d="",pen=false,prevY=null; const dense=s.pts.length>12;
    for(const [dt,v,wb] of s.pts){
      if(v==null){pen=false;continue}
      const X=x(T(dt)).toFixed(1),Y=y(v).toFixed(1);
      d+= pen ? (dense?`H${X}V${Y}`:`L${X},${Y}`) : `M${X},${Y}`; pen=true; prevY=Y;
      if(!dense) g+=`<circle cx="${X}" cy="${Y}" r="3" fill="${wb?o.bg:s.color}" stroke="${s.color}" stroke-width="1.5"><title>${s.label} ${dt}: ${v.toFixed(2)}%${wb?" (Wayback)":""}</title></circle>`;
    }
    if(dense&&pen) d+=`H${W-m.r}`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${o.sw||1.8}" ${dense?"":'stroke-dasharray="4 3" opacity=".75"'}/>`;
  }
  return `<svg class="ch" width="100%" viewBox="0 0 ${W} ${H}" data-start="${start}" data-end="${end}" data-ml="${m.l}" data-mr="${m.r}" data-w="${W}">${g}<line class="rule" y1="${m.t}" y2="${H-m.b}" stroke="${o.ink}" visibility="hidden"/></svg>`;
}
function seriesFor(cur,term){
  return DATA.filter(p=>!state.hidden.has(p.id)).map(p=>{const c=cell(p,cur,term);return c?{label:p.label,color:p.color,pts:c.hist,id:p.id}:null}).filter(Boolean);
}
// hover readout: nearest value at or before the pointer date for every line
function wireHover(root,cur,term,readout){
  const svg=root.querySelector("svg.ch"); if(!svg) return;
  const rule=svg.querySelector(".rule"), ss=seriesFor(cur,term);
  svg.addEventListener("mousemove",e=>{
    const b=svg.getBoundingClientRect(), W=+svg.dataset.w, px=(e.clientX-b.left)/b.width*W;
    const s=+svg.dataset.start,en=+svg.dataset.end,ml=+svg.dataset.ml,mr=+svg.dataset.mr;
    const t=s+(Math.min(Math.max(px,ml),W-mr)-ml)/(W-ml-mr)*(en-s);
    rule.setAttribute("x1",px);rule.setAttribute("x2",px);rule.setAttribute("visibility","visible");
    const day=new Date(t).toISOString().slice(0,10);
    readout.innerHTML=`<b>${day}</b> `+ss.map(x=>{let v=null;for(const q of x.pts){if(T(q[0])<=t)v=q[1];else break}

  });
  svg.addEventListener("mouseleave",()=>{rule.setAttribute("visibility","hidden");readout.innerHTML="&nbsp;"});
}

      <h2 style="margin-top:18px">${cur} ${term}Y · all products
        <span class="seg">${["6M","1Y","ALL"].map(r=>`<button class="${state.range===r?"on":""}" data-r="${r}">${r}</button>`).join("")}</span></h2>
      <div id="ro" class="mono" style="font-size:11px;color:#8a99ab;min-height:16px">&nbsp;</div>
      ${chart(seriesFor(cur,term),{w:900,h:250,grid:"#17212c",ink:"#6f8196",bg:"#0b0f14",range:state.range})}
      <div class="note">Solid step lines = insurer-published history. Dashed with hollow markers = scattered Wayback captures, not joined-up history.</div>
    </div>
    <div class="pane">
      <h2>What changed</h2>
      ${mv.slice(0,16).map(m=>`<div class="mv"><b>${m.p.label}</b><span class="mono num ${m.kind?(m.kind==="resumed"?"up":"dn"):cls(m.d)}">${m.kind?m.kind:fd(m.d)}</span><small>${m.cur} ${m.term}Y · ${planShort(m.pl.ja)||"—"} · now ${fmt(m.v)} · ${md(m.from)}→${md(m.to)}${m.stale?" (no data between)":""}</small></div>`).join("")}
      <div class="note">${mv.filter(m=>!m.stale).length} series moved since the previous half-month; the rest are compared with an older capture.</div>
    </div>
  </div>`;
  el.querySelectorAll("th.case").forEach(th=>th.onclick=()=>{state.cur=th.dataset.c;state.term=th.dataset.t;render()});
  el.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>{const id=tr.dataset.id;state.hidden.has(id)?state.hidden.delete(id):state.hidden.add(id);render()});
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{state.range=b.dataset.r;render()});
  wireHover(el,cur,term,el.querySelector("#ro"));
}

/* ================= Variant B: analyst dashboard ================= */
function renderB(el){
  const {cur,term}=state, n=+term, rk=ranked(cur,term), on=rk.filter(x=>x.c.v!=null);
  const mv=movers(), caseMv=mv.filter(m=>m.cur===cur&&m.term===term&&m.d!=null&&!m.stale);
  const top=on[0], max=Math.max(...on.map(x=>x.c.v),1), spread=on.length>1?on[0].c.v-on[on.length-1].c.v:0;
  const big=mv.find(m=>m.d!=null&&!m.stale);
  const terms=[...new Set(DATA.flatMap(p=>p.plans.flatMap(pl=>Object.keys(pl.series).filter(k=>k.startsWith(cur+"|")).map(k=>k.split("|")[1]))))].sort((a,b)=>a-b);
  el.className="B"; el.innerHTML=`
  <div class="top"><h1>貯蓄性一時払商品 レートボード<small>Single-premium savings products · 積立利率 · as of ${latest()}</small></h1>
    <div class="pick">Currency <span class="pills">${["USD","AUD","JPY"].map(c=>`<button data-c="${c}" class="${c===cur?"on":""}">${c}</button>`).join("")}</span></div>
    <div class="pick">Term <span class="pills">${terms.map(t=>`<button data-t="${t}" class="${t===term?"on":""}">${t}年</button>`).join("")}</span></div>
  </div>
  <div class="wrap">
    <div class="card kpi"><h2>Highest ${cur} ${term}年 rate</h2><div class="big num">${top?fmt(top.c.v)+"%":"–"}</div><div class="sub">${top?top.p.label+"<br>"+top.p.insurer_en:"No product offers this case"}</div></div>
    <div class="card kpi"><h2>Products offering this case</h2><div class="big num">${on.length}<span style="font-size:18px;color:#8a94a6"> / ${DATA.length}</span></div><div class="sub">Spread between best and worst: <b class="num">${spread.toFixed(2)}</b> pts</div></div>
    <div class="card kpi"><h2>Moved this period (this case)</h2><div class="big num">${caseMv.length}</div><div class="sub">${caseMv.filter(m=>m.d>0).length} up · ${caseMv.filter(m=>m.d<0).length} down</div></div>
    <div class="card kpi"><h2>Biggest move, any case</h2><div class="big num" style="color:${big&&big.d>0?"#0a7a45":"#b42318"}">${big?fd(big.d):"–"}</div><div class="sub">${big?`${big.p.label}<br>${big.cur} ${big.term}年 → ${fmt(big.v)}%`:""}</div></div>

    <div class="card league"><h2>League table · ${cur} ${term}年 · click a row to hide it from the chart</h2>
      <div class="lr head"><span></span><span>Product</span><span>積立利率</span><span class="r">Rate</span><span class="r">Change</span><span class="r">${n}年後 est.</span></div>
      ${rk.map((x,i)=>{const d=delta(x.c), ev=estValue(x.c.v,n);return `<div class="lr${state.hidden.has(x.p.id)?" dim":""}" data-id="${x.p.id}">
        <span class="rk">${x.c.v==null?"–":i+1}</span>
        <span class="nm"><b>${x.p.label}</b><small>${x.p.insurer_en} · ${planShort(x.c.plan.ja)||"standard"}${x.c.plan.band?" · age "+x.c.plan.band:""}</small></span>
        <span class="bar"><i style="width:${x.c.v==null?0:x.c.v/max*100}%;background:${x.p.color}"></i></span>
        <span class="val num">${x.c.v==null?'<span class="muted">停止</span>':fmt(x.c.v)+"%"}</span>
        <span class="r"><span class="chip num ${cls(d)}">${d==null?"—":fd(d)}</span></span>
        <span class="r num">${ev==null?"–":ev.toFixed(1)+"%"}</span></div>`}).join("")}
      <p class="muted" style="margin:12px 0 0">${n}年後 est. = (1 + rate)<sup>${n}</sup>, a rough return multiple before loads and FX. Change is against each product's previous period.</p>
    </div>
    <div class="card chart"><h2>History · ${cur} ${term}年
      <span class="pills" style="float:right;margin-top:-6px">${["6M","1Y","ALL"].map(r=>`<button data-r="${r}" class="${state.range===r?"on":""}">${r}</button>`).join("")}</span></h2>
      <div id="ro" class="muted" style="min-height:34px;line-height:1.4">&nbsp;</div>
      ${chart(seriesFor(cur,term),{w:520,h:330,grid:"#edf0f5",ink:"#8a94a6",bg:"#fff",range:state.range,sw:2.2})}
      <p class="muted" style="margin:8px 0 0">Dashed lines with hollow markers are scattered Wayback captures.</p>
    </div>
    <div class="card feed"><h2>What changed since the previous period · all currencies and terms</h2>
      <div class="feedgrid">${mv.slice(0,12).map(m=>`<div class="fi"><span class="mvv num" style="color:${m.kind?(m.kind==="resumed"?"#0a7a45":"#b42318"):m.d>0?"#0a7a45":"#b42318"}">${m.kind?m.kind:fd(m.d)}</span><b>${m.p.label}</b><small>${m.cur} ${m.term}年 · ${planShort(m.pl.ja)||"standard"}<br>now ${fmt(m.v)}% · ${md(m.from)} → ${md(m.to)}${m.stale?" (no data between)":""}</small></div>`).join("")}</div>
    </div>
  </div>`;
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{state.cur=b.dataset.c;
    const ts=[...new Set(DATA.flatMap(p=>p.plans.flatMap(pl=>Object.keys(pl.series).filter(k=>k.startsWith(state.cur+"|")).map(k=>k.split("|")[1]))))];
    if(!ts.includes(state.term)) state.term="10"; render()});
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{state.term=b.dataset.t;render()});
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{state.range=b.dataset.r;render()});
  el.querySelectorAll(".lr[data-id]").forEach(r=>r.onclick=()=>{const id=r.dataset.id;state.hidden.has(id)?state.hidden.delete(id):state.hidden.add(id);render()});
  wireHover(el,cur,term,el.querySelector("#ro"));
}

/* ================= Variant C: editorial (English, terse) ================= */
const PLAN_EN={kihon:"Basic",manki:"Maturity-focused",manki_100:"Maturity-focused, 100% death benefit",manki_50:"Maturity-focused, 50% death benefit",
  shisu:"Index",standard:"",no_target:"No target",target:"With target",jpy_nenkin:"Annuity-focused",jpy_kaigo:"Care cover",
  fx_no_rider:"No guarantee rider",fx_rider:"Guarantee rider",nenkin_genshi_jujitsu:"Annuity-focused (tontine)",tsumitate:"Accumulation",teiki_shiharai:"Periodic payout"};
const en = p => (p.en||p.id).replace(" Rakuten Bank Edition"," (Rakuten)").replace(/ \(fixed-rate increase plan\)/i,"");
const INS_EN = p => p.insurer_en.replace(" Life","");
function renderC(el){
  const {cur,term}=state, mv=movers().filter(m=>m.d!=null&&!m.stale), rk=ranked(cur,term).filter(x=>x.c.v!=null);
  const usd=mv.filter(m=>m.cur==="USD"), dn=usd.filter(m=>m.d<0).length, up=usd.filter(m=>m.d>0).length;
  const dir=dn>up?"fall":up>dn?"rise":"mixed", n=new Set(usd.filter(m=>dn>up?m.d<0:m.d>0).map(m=>m.p.insurer)).size, top=rk[0];
  el.className="C"; el.innerHTML=`<div class="col">
  <div class="kick"><span>JP savings · rate watch</span><span>${latest()}</span></div>
  <h1>${dir==="mixed"?"USD rates mixed":`USD rates ${dir} at ${n} insurer${n===1?"":"s"}`}</h1>
  <div class="stats">
    <div><b class="num">${top?fmt(top.c.v)+"%":"–"}</b><span>Best ${cur} ${term}Y · ${top?en(top.p):""}</span></div>
    <div><b class="num">${rk.length>1?(rk[0].c.v-rk[rk.length-1].c.v).toFixed(2):"–"}</b><span>Spread, ${rk.length} products</span></div>
    <div><b class="num">${mv.filter(m=>m.d<0).length}<i>↓</i> ${mv.filter(m=>m.d>0).length}<i>↑</i></b><span>Series moved</span></div>
  </div>

  <h2>Markets</h2>
  <div class="multi">${CASES.map(([c,t])=>{const r=ranked(c,t).filter(x=>x.c.v!=null);return `<div class="sm${c===cur&&t===term?" on":""}" data-c="${c}" data-t="${t}"><h3>${c} ${t}Y <span class="num">${r.length?fmt(r[0].c.v)+"%":"–"}</span></h3><p>${r.length?en(r[0].p):"Not offered"}</p>${chart(DATA.map(p=>{const x=cell(p,c,t);return x?{label:en(p),color:(c===cur&&t===term)?p.color:"#9a927f",pts:x.hist}:null}).filter(Boolean),{w:320,h:170,grid:"#ece5d6",ink:"#8b867b",bg:"#fbf8f2",range:"ALL",sw:1.4,ml:28})}</div>`}).join("")}</div>

  <div class="two"><div>
    <h2>${cur} ${term}Y</h2>
    <table><thead><tr><th>Product</th><th>Rate</th><th>Chg</th><th>After ${term}Y</th><th>As of</th></tr></thead><tbody>
    ${ranked(cur,term).map((x,i)=>{const d=delta(x.c),ev=estValue(x.c.v,+term),pl=PLAN_EN[x.c.plan.key]??x.c.plan.key;return `<tr><td><span class="sw" style="background:${x.p.color}"></span>${en(x.p)}<small>${INS_EN(x.p)}${pl?" · "+pl:""}</small></td><td class="num${i===0&&x.c.v!=null?" hi":""}">${x.c.v==null?"Suspended":fmt(x.c.v)+"%"}</td><td class="num ${cls(d)==="up"?"up":cls(d)==="dn"?"dn":""}">${d==null?"—":fd(d)}</td><td class="num">${ev==null?"–":ev.toFixed(1)}</td><td class="num">${md(x.c.date)}</td></tr>`}).join("")}
    </tbody></table></div>
    <div><h2>Moves</h2>
    ${mv.slice(0,8).map(m=>`<div class="mvl"><span>${en(m.p)}<small>${m.cur} ${m.term}Y${PLAN_EN[m.pl.key]?" · "+PLAN_EN[m.pl.key]:""} · ${fmt(m.v)}%</small></span><span class="x num ${m.d>0?"up":"dn"}">${fd(m.d)}</span></div>`).join("")}</div>
  </div>
  <p class="foot">After ${term}Y = 100 × (1 + rate)<sup>${term}</sup>, before loads and FX. Dashed = Wayback captures.</p>
  </div>`;
  el.querySelectorAll(".sm").forEach(s=>s.onclick=()=>{state.cur=s.dataset.c;state.term=s.dataset.t;render();});
}

/* ---------- switcher ---------- */
const VARIANTS={A:["Terminal",renderA],B:["Analyst dashboard",renderB],C:["Editorial",renderC]};
const keys=Object.keys(VARIANTS);
let VAR=(()=>{try{const v=new URLSearchParams(location.search).get("variant");return keys.includes(v)?v:"C"}catch(e){return "C"}})();
function current(){return VAR}
function render(){const v=current();VARIANTS[v][1](document.getElementById("app"));document.getElementById("vlabel").textContent=`${v} · ${VARIANTS[v][0]}`;document.body.style.background=getComputedStyle(document.getElementById("app")).backgroundColor}
function go(n){const i=(keys.indexOf(current())+n+keys.length)%keys.length;VAR=keys[i];try{const u=new URL(location);u.searchParams.set("variant",VAR);history.replaceState(null,"",u)}catch(e){}window.scrollTo(0,0);render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
addEventListener("keydown",e=>{if(e.target.matches("input,textarea,[contenteditable]"))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
render();
</script>
</body>
